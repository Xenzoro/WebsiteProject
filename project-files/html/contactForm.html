<section class="contact-page">
    <div class="contact-content" id="contact-location">
        <div class="contact-body-row">
            <div class="contact-left-col">
                <div class="contact-header-group">
                    <h2>Get In Touch</h2>
                    <hr>
                    <div class="social-links">
                        <a href="https://www.linkedin.com/in/jacobmartinii/" target="_blank" class="social-pill">LinkedIn</a>

                        <a href="#contact-location" class="social-pill">Email</a>
                    </div>
                </div>
                <form action="https://api.web3forms.com/submit" method="Post" class="contact-form">
                    <input type="hidden" name="access_key" value="cbf0ecd1-94d3-4c33-87b1-53b705cf5316">
                    <input type="text" name="Name" placeholder="Your Name" required class="contact-inputs">
                    <input type="email" name="Email" placeholder="Your Email" required class="contact-inputs">
                    <textarea name="message" placeholder="Your Message" class="contact-inputs" required></textarea>
                    <button type="submit">Submit</button>
                </form>
            </div>
            <div class="contact-right">
                <div class="contact-image-placeholder">
                    <span class="contact-image-placeholder-text">Image Coming Soon</span>
                </div>
            </div>
        </div>
